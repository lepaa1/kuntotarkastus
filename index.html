<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>Kuntotarkastus</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/ikoni-192.png">
  <link rel="apple-touch-icon" href="icons/ikoni-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="ylapalkki">
    <button id="takaisin" class="ikonipainike" hidden aria-label="Takaisin">‹</button>
    <h1 id="otsikko">Kuntotarkastus</h1>
    <button id="koti" class="ikonipainike" hidden aria-label="Kohteen etusivu" title="Kohteen etusivu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.6 11.2l1.3 1.5L5 11.8V21h5.2v-5.6h3.6V21H19v-9.2l1.1 0.9 1.3-1.5z"/></svg>
    </button>
    <button id="valikko" class="ikonipainike" aria-label="Asetukset">⚙</button>
  </header>

  <main id="sisalto"></main>

  <footer id="alapalkki" hidden></footer>

  <div id="ilmoitus" role="status" aria-live="polite" hidden></div>

  <dialog id="dialogi">
    <div id="dialogi-sisalto"></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
